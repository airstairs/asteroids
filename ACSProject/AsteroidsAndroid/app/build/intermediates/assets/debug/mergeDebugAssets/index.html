<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pencil Asteroids</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #535353;
            --card-bg: #f7f7f7;
            --border-color: #535353;
            --dark-border: #222222;
            --title-color: #222222;
            --btn-bg: #535353;
            --btn-text: #f7f7f7;
            --arcade-btn-bg: rgba(247, 247, 247, 0.94);
            --arcade-btn-color: #333333;
            --arcade-btn-active-bg: #535353;
            --arcade-btn-active-color: #f7f7f7;
            --table-bg: #ffffff;
            --table-th-bg: #e8e8e8;
            --table-border: #535353;
            --table-dash: #cccccc;
            --highlight-bg: #fff8c4;
            --highlight-color: #000000;
            --grid-color: #e0e0e0;
            --key-bg: #ffffff;
            --key-color: #333333;
        }

        body.dark-mode {
            --bg-color: #161616;
            --text-color: #d0d0d0;
            --card-bg: #1c1c1c;
            --border-color: #a0a0a0;
            --dark-border: #e0e0e0;
            --title-color: #f0f0f0;
            --btn-bg: #a0a0a0;
            --btn-text: #161616;
            --arcade-btn-bg: rgba(28, 28, 28, 0.94);
            --arcade-btn-color: #d0d0d0;
            --arcade-btn-active-bg: #a0a0a0;
            --arcade-btn-active-color: #161616;
            --table-bg: #222222;
            --table-th-bg: #2d2d2d;
            --table-border: #a0a0a0;
            --table-dash: #444444;
            --highlight-bg: #3d3400;
            --highlight-color: #fff8c4;
            --grid-color: #262626;
            --key-bg: #222222;
            --key-color: #d0d0d0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background-color: var(--bg-color);
            opacity: 1.00;
            z-index: 20;
            padding: 16px;
            overflow-y: auto;
            transition: background-color 0.3s ease;
        }

        .sketch-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 4px 4px 0px var(--border-color);
            padding: 24px 20px;
            max-width: 380px;
            width: 95%;
            text-align: center;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 12px;
            color: var(--title-color);
        }

        .start-graphic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            cursor: pointer;
        }

        #start-graphic-canvas {
            width: 260px;
            height: 140px;
            background: transparent;
            touch-action: manipulation;
            cursor: pointer;
        }

        .tap-hint {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-color);
            margin-top: 6px;
            animation: pulse 1.4s infinite ease-in-out;
        }

        .android-footer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 25;
        }

        .for-android-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--text-color);
            margin-bottom: 2px;
            text-transform: lowercase;
        }

        .android-head-svg {
            width: 72px;
            height: 40px;
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .sketch-button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--dark-border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 3px 3px 0px var(--dark-border);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            outline: none;
            touch-action: manipulation;
        }

        .sketch-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--dark-border);
        }

        #hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-color);
        }

        #pause-toggle-btn {
            pointer-events: auto;
            background: var(--arcade-btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
        }
        #pause-toggle-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        #arcade-controls {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .dpad-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .arcade-btn {
            width: 80px;
            height: 80px;
            background: var(--arcade-btn-bg);
            border: 4px solid var(--border-color);
            border-radius: 50%;
            color: var(--arcade-btn-color);
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 4px 0px var(--border-color);
            pointer-events: auto;
            touch-action: manipulation;
            user-select: none;
            outline: none;
            cursor: pointer;
        }

        .arcade-btn:active, .arcade-btn.active {
            background: var(--arcade-btn-active-bg);
            color: var(--arcade-btn-active-color);
            transform: translate(2px, 3px);
            box-shadow: 1px 1px 0px var(--dark-border);
        }

        .fire-btn {
            width: 92px;
            height: 92px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: 255px 20px 225px 20px/20px 225px 20px 255px;
        }

        .leaderboard-table {
            width: 100%;
            margin: 10px 0;
            border-collapse: collapse;
            font-size: 12px;
            background: var(--table-bg);
            border: 2px solid var(--table-border);
            border-radius: 8px;
            overflow: hidden;
            color: var(--text-color);
        }

        .leaderboard-table th {
            background: var(--table-th-bg);
            padding: 6px;
            border-bottom: 2px solid var(--table-border);
            text-align: center;
            font-size: 11px;
            color: var(--title-color);
        }

        .leaderboard-table td {
            padding: 5px 8px;
            border-bottom: 1px dashed var(--table-dash);
            text-align: center;
            font-weight: bold;
        }

        .leaderboard-table tr.highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-color);
        }

        .initials-display {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 10px;
            margin: 12px 0;
            padding: 6px;
            background: var(--table-bg);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            color: var(--title-color);
            display: inline-block;
            min-width: 140px;
        }

        .keyboard-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            margin-top: 10px;
        }

        .key-btn {
            width: 32px;
            height: 36px;
            background: var(--key-bg);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            color: var(--key-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 1px 2px 0px var(--border-color);
            touch-action: manipulation;
        }

        .key-btn:active {
            background: var(--btn-bg);
            color: var(--btn-text);
            transform: translate(1px, 1px);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        .key-btn.wide {
            width: 68px;
            font-size: 11px;
        }

        .key-btn.submit {
            background: var(--btn-bg);
            color: var(--btn-text);
            width: 80px;
            font-size: 12px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Top HUD Layer -->
    <div id="hud">
        <div>HI <span id="hi-score">00000</span> <span id="current-score">00000</span></div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span>WAVE <span id="wave-num">1</span></span>
            <button id="pause-toggle-btn">PAUSE</button>
        </div>
    </div>

    <!-- On-Screen Virtual Arcade Controls -->
    <div id="arcade-controls">
        <div class="dpad-group">
            <button id="btn-left" class="arcade-btn" aria-label="Rotate Left">◄</button>
            <button id="btn-right" class="arcade-btn" aria-label="Rotate Right">►</button>
        </div>
        <button id="btn-fire" class="arcade-btn fire-btn" aria-label="Fire Bullet">FIRE</button>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
        <div class="sketch-card">
            <h1>ASTEROIDS</h1>
            <div class="start-graphic-container" id="start-graphic-trigger">
                <canvas id="start-graphic-canvas" width="260" height="140"></canvas>
                <div class="tap-hint">[ TAP ASTEROID TO START ]</div>
            </div>
        </div>

        <div class="android-footer">
            <div class="for-android-text">for android</div>
            <svg class="android-head-svg" viewBox="0 0 100 55" xmlns="http://www.w3.org/2000/svg">
                <line x1="32" y1="20" x2="18" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <line x1="32" y1="20" x2="18" y2="5" stroke="var(--dark-border)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="68" y1="20" x2="82" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <line x1="68" y1="20" x2="82" y2="5" stroke="var(--dark-border)" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 10 55 A 40 40 0 0 1 90 55 Z" fill="var(--card-bg)" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                <path d="M 9.5 55 A 40.5 40.5 0 0 1 90.5 55 Z" fill="none" stroke="var(--dark-border)" stroke-width="1.5"/>
                <circle cx="34" cy="36" r="3.5" fill="currentColor"/>
                <circle cx="34" cy="36" r="2" fill="var(--dark-border)"/>
                <circle cx="66" cy="36" r="3.5" fill="currentColor"/>
                <circle cx="66" cy="36" r="2" fill="var(--dark-border)"/>
                <line x1="72" y1="28" x2="78" y2="34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="76" y1="24" x2="82" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <!-- Pause Menu Overlay -->
    <div id="pause-overlay" class="overlay hidden">
        <div class="sketch-card">
            <h1>PAUSED</h1>
            <button id="resume-btn" class="sketch-button">RESUME GAME</button>
            <button id="quit-btn" class="sketch-button" style="margin-top: 12px; background-color: #a04040;">QUIT TO MENU</button>
        </div>
    </div>

    <!-- Initials Keyboard Entry Modal -->
    <div id="keyboard-modal" class="overlay hidden">
        <div class="sketch-card">
            <h1 style="color: #4caf50; font-size: 22px;">HIGH SCORE!</h1>
            <p style="font-size: 12px; color: var(--text-color);">Enter your 3-letter initials:</p>
            <div class="initials-display" id="initials-display">___</div>
            <div class="keyboard-grid" id="keyboard-grid"></div>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="overlay hidden">
        <div class="sketch-card">
            <h1 style="color: #e53935; font-size: 24px;">GAME OVER</h1>
            <p style="font-size: 12px; color: var(--text-color);">Your score: <b id="final-score" style="font-size: 16px; color: var(--title-color);">0</b></p>
            <p style="margin-top: 10px; font-weight: bold; font-size: 12px; color: var(--title-color);">TOP 10 LEADERBOARD</p>
            <table class="leaderboard-table">
                <thead>
                    <tr><th>#</th><th>NAME</th><th>SCORE</th></tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
            <button id="restart-btn" class="sketch-button">PLAY AGAIN</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- Android WebView Bridge for Instant Theme Switching ---
        window.setAppTheme = function(isDarkMode) {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        };

        // --- Web Audio API Retro Sound Synthesizer ---
        let audioCtx = null;
        let masterGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(1.5, audioCtx.currentTime); // Master boost for mobile speakers
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const SoundFX = {
            shoot() {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime); // Lowered laser volume to prevent piercing spikes
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            },
            explosion() {
                initAudio();
                if (!audioCtx) return;
                let bufferSize = audioCtx.sampleRate * 0.4;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                let whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);

                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.45, audioCtx.currentTime); // Boosted explosion punch
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                whiteNoise.start();
            },
            click() {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startCanvas = document.getElementById('start-graphic-canvas');
        const startCtx = startCanvas.getContext('2d');
        const startGraphicTrigger = document.getElementById('start-graphic-trigger');

        const startOverlay = document.getElementById('start-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const keyboardModal = document.getElementById('keyboard-modal');
        const restartBtn = document.getElementById('restart-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const quitBtn = document.getElementById('quit-btn');
        const pauseToggleBtn = document.getElementById('pause-toggle-btn');

        const scoreEl = document.getElementById('current-score');
        const hiScoreEl = document.getElementById('hi-score');
        const waveEl = document.getElementById('wave-num');
        const finalScoreEl = document.getElementById('final-score');
        const leaderboardBody = document.getElementById('leaderboard-body');
        const initialsDisplay = document.getElementById('initials-display');
        const keyboardGrid = document.getElementById('keyboard-grid');

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnFire = document.getElementById('btn-fire');

        function isDarkMode() {
            return document.body.classList.contains('dark-mode');
        }

        let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'KEYBOARD', 'GAMEOVER'
        let score = 0;
        let wave = 1;
        let screenShake = 0;
        let pendingHighScoreIndex = -1;
        let currentInitials = "";

        function getTop10Scores() {
            try {
                const stored = localStorage.getItem('pencil_asteroids_top10');
                if (stored) return JSON.parse(stored);
            } catch (e) {}
            return [];
        }

        function saveTop10Scores(scores) {
            try {
                localStorage.setItem('pencil_asteroids_top10', JSON.stringify(scores));
            } catch (e) {}
        }

        let ship = {
            x: 0, y: 0, radius: 18, angle: -Math.PI / 2,
            rotSpeed: 0, minRotSpeed: 0.03, maxRotSpeed: 0.11, rotAccel: 0.005
        };

        let bullets = [];
        let asteroids = [];
        let particles = [];
        let floatingTexts = [];

        let spawnTimer = 0;
        let spawnInterval = 180;
        let isHoldingFire = false;
        let holdTimer = 0;
        let fireCooldown = 0;

        let arcadeLeft = false;
        let arcadeRight = false;
        const keys = { left: false, right: false, space: false };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'PAUSED') {
                ship.x = canvas.width / 2;
                ship.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function padZero(num, size = 5) {
            let s = Math.floor(num) + "";
            while (s.length < size) s = "0" + s;
            return s;
        }

        function setupButtonEvents(btn, onDown, onUp) {
            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault();
                btn.classList.add('active'); onDown();
            });
            btn.addEventListener('pointerup', (e) => {
                e.stopPropagation(); e.preventDefault();
                btn.classList.remove('active'); onUp();
            });
            btn.addEventListener('pointerleave', () => { btn.classList.remove('active'); onUp(); });
            btn.addEventListener('pointercancel', () => { btn.classList.remove('active'); onUp(); });
        }

        setupButtonEvents(btnLeft, () => arcadeLeft = true, () => arcadeLeft = false);
        setupButtonEvents(btnRight, () => arcadeRight = true, () => arcadeRight = false);
        setupButtonEvents(btnFire, () => {
            isHoldingFire = true; holdTimer = 0;
            if (gameState === 'PLAYING' && fireCooldown <= 0) {
                fireBullet(); fireCooldown = 12;
            }
        }, () => { isHoldingFire = false; });

        pauseToggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            SoundFX.click();
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
            }
        });

        resumeBtn.addEventListener('click', () => {
            SoundFX.click();
            pauseOverlay.classList.add('hidden');
            gameState = 'PLAYING';
        });

        quitBtn.addEventListener('click', () => {
            SoundFX.click();
            pauseOverlay.classList.add('hidden');
            startOverlay.classList.remove('hidden');
            gameState = 'START';
        });

        let startGraphicFrame = 0;
        let startAsteroidPressed = false;

        function renderStartGraphic() {
            startGraphicFrame++;
            startCtx.clearRect(0, 0, startCanvas.width, startCanvas.height);
            const dark = isDarkMode();
            const strokeColor = dark ? '#d0d0d0' : '#222222';
            const fillColor = dark ? '#1c1c1c' : '#f7f7f7';
            const laserColor = dark ? '#ffffff' : '#222222';

            startCtx.strokeStyle = strokeColor;
            startCtx.fillStyle = fillColor;
            startCtx.lineWidth = 2;
            startCtx.lineCap = 'round';
            startCtx.lineJoin = 'round';

            startCtx.save();
            startCtx.translate(45, 70);
            startCtx.rotate(-Math.PI / 12);
            startCtx.beginPath();
            startCtx.moveTo(18, 0); startCtx.lineTo(-12, 10); startCtx.lineTo(-6, 0); startCtx.lineTo(-12, -10);
            startCtx.closePath(); startCtx.fill(); startCtx.stroke();
            startCtx.beginPath(); startCtx.arc(0, 0, 3, 0, Math.PI * 2); startCtx.stroke();
            startCtx.restore();

            let bulletProgress = (startGraphicFrame % 40) / 40;
            let bx = 65 + bulletProgress * 95;
            let by = 67 - bulletProgress * 6;
            startCtx.save();
            startCtx.strokeStyle = laserColor; startCtx.lineWidth = 2.5;
            startCtx.beginPath(); startCtx.moveTo(bx, by); startCtx.lineTo(bx - 12, by + 1); startCtx.stroke();
            startCtx.restore();

            startCtx.save();
            startCtx.translate(195, 60);
            if (startAsteroidPressed) startCtx.translate(2, 2);
            const points = [
                {x: -30, y: -12}, {x: -12, y: -30}, {x: 18, y: -25},
                {x: 32, y: -8}, {x: 28, y: 18}, {x: 8, y: 32},
                {x: -20, y: 28}, {x: -32, y: 10}
            ];
            startCtx.fillStyle = startAsteroidPressed ? (dark ? '#333333' : '#e8e8e8') : fillColor;
            startCtx.beginPath();
            points.forEach((pt, i) => {
                let jx = pt.x + (Math.random() - 0.5) * 0.8;
                let jy = pt.y + (Math.random() - 0.5) * 0.8;
                if (i === 0) startCtx.moveTo(jx, jy); else startCtx.lineTo(jx, jy);
            });
            startCtx.closePath(); startCtx.fill(); startCtx.stroke();
            startCtx.fillStyle = laserColor;
            startCtx.font = 'bold 12px "Courier New", Courier, monospace';
            startCtx.textAlign = 'center'; startCtx.textBaseline = 'middle';
            startCtx.fillText('START', 0, 0);
            startCtx.restore();

            if (gameState === 'START') requestAnimationFrame(renderStartGraphic);
        }

        startGraphicTrigger.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            SoundFX.click();
            startAsteroidPressed = true;
            setTimeout(() => {
                startOverlay.classList.add('hidden');
                initGame();
                gameState = 'PLAYING';
                startAsteroidPressed = false;
            }, 120);
        });

        function fireBullet() {
            SoundFX.shoot();
            let muzzleX = ship.x + Math.cos(ship.angle) * (ship.radius + 6);
            let muzzleY = ship.y + Math.sin(ship.angle) * (ship.radius + 6);
            bullets.push({ x: muzzleX, y: muzzleY, vx: Math.cos(ship.angle) * 11, vy: Math.sin(ship.angle) * 11, life: 60 });
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: muzzleX, y: muzzleY,
                    vx: (Math.random() - 0.5) * 3 + Math.cos(ship.angle) * 2,
                    vy: (Math.random() - 0.5) * 3 + Math.sin(ship.angle) * 2,
                    life: 12, maxLife: 12
                });
            }
        }

        function createAsteroid(x, y, radius = 38) {
            let spawnX = x, spawnY = y;
            if (spawnX === undefined || spawnY === undefined) {
                let valid = false, attempts = 0;
                while (!valid && attempts < 20) {
                    attempts++;
                    if (Math.random() > 0.5) {
                        spawnX = Math.random() < 0.5 ? -radius : canvas.width + radius;
                        spawnY = Math.random() * canvas.height;
                    } else {
                        spawnX = Math.random() * canvas.width;
                        spawnY = Math.random() < 0.5 ? -radius : canvas.height + radius;
                    }
                    if (Math.hypot(spawnX - ship.x, spawnY - ship.y) > 250) valid = true;
                }
            }
            let speed = (0.5 + Math.random() * 0.6) + (wave * 0.12);
            let targetAngle = Math.atan2(ship.y - spawnY, ship.x - spawnX) + (Math.random() - 0.5) * 0.9;
            let points = [];
            let totalPoints = Math.floor(Math.random() * 3) + 7;
            for (let i = 0; i < totalPoints; i++) {
                let a = (i / totalPoints) * Math.PI * 2;
                let vr = radius * (0.75 + Math.random() * 0.45);
                points.push({ x: Math.cos(a) * vr, y: Math.sin(a) * vr });
            }
            asteroids.push({
                x: spawnX, y: spawnY, vx: Math.cos(targetAngle) * speed, vy: Math.sin(targetAngle) * speed,
                radius: radius, points: points, rotation: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.02
            });
        }

        function spawnExplosion(x, y, count = 12) {
            SoundFX.explosion();
            screenShake = 6;
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20 + Math.random() * 20, maxLife: 40 });
            }
        }

        function initGame() {
            ship.x = canvas.width / 2; ship.y = canvas.height / 2;
            ship.angle = -Math.PI / 2; ship.rotSpeed = 0;
            bullets = []; asteroids = []; particles = []; floatingTexts = [];
            score = 0; wave = 1; spawnTimer = 0; spawnInterval = 180;
            for (let i = 0; i < 2; i++) createAsteroid();
            const topScores = getTop10Scores();
            hiScoreEl.innerText = padZero(topScores[0] ? topScores[0].score : 0);
            scoreEl.innerText = padZero(score);
            waveEl.innerText = wave;
        }

        function buildCustomKeyboard() {
            keyboardGrid.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
                const key = document.createElement('button');
                key.className = 'key-btn'; key.innerText = letter;
                key.addEventListener('click', () => {
                    SoundFX.click();
                    if (currentInitials.length < 3) { currentInitials += letter; initialsDisplay.innerText = currentInitials.padEnd(3, '_'); }
                });
                keyboardGrid.appendChild(key);
            });
            const backKey = document.createElement('button');
            backKey.className = 'key-btn wide'; backKey.innerText = '◄ BACK';
            backKey.addEventListener('click', () => {
                SoundFX.click();
                if (currentInitials.length > 0) { currentInitials = currentInitials.slice(0, -1); initialsDisplay.innerText = currentInitials.padEnd(3, '_'); }
            });
            keyboardGrid.appendChild(backKey);
            const submitKey = document.createElement('button');
            submitKey.className = 'key-btn submit'; submitKey.innerText = 'DONE ✓';
            submitKey.addEventListener('click', () => {
                SoundFX.click();
                let finalName = currentInitials.trim().padEnd(3, 'A').slice(0, 3);
                let topScores = getTop10Scores();
                if (pendingHighScoreIndex !== -1) {
                    topScores.splice(pendingHighScoreIndex, 0, { name: finalName, score: Math.floor(score) });
                    saveTop10Scores(topScores.slice(0, 10));
                }
                keyboardModal.classList.add('hidden');
                renderLeaderboard(pendingHighScoreIndex);
                gameOverOverlay.classList.remove('hidden');
                gameState = 'GAMEOVER';
            });
            keyboardGrid.appendChild(submitKey);
        }

        function renderLeaderboard(highlightIdx = -1) {
            const topScores = getTop10Scores();
            leaderboardBody.innerHTML = '';
            if (topScores.length === 0) {
                leaderboardBody.innerHTML = `<tr><td colspan="3" style="color: #888; font-style: italic;">No scores yet!</td></tr>`;
                return;
            }
            topScores.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                if (idx === highlightIdx) tr.className = 'highlight';
                tr.innerHTML = `<td>${idx + 1}</td><td>${entry.name}</td><td>${entry.score}</td>`;
                leaderboardBody.appendChild(tr);
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            const turningLeft = keys.left || arcadeLeft;
            const turningRight = keys.right || arcadeRight;
            if (turningLeft || turningRight) {
                ship.rotSpeed = ship.rotSpeed < ship.minRotSpeed ? ship.minRotSpeed : Math.min(ship.maxRotSpeed, ship.rotSpeed + ship.rotAccel);
                if (turningLeft) ship.angle -= ship.rotSpeed;
                if (turningRight) ship.angle += ship.rotSpeed;
            } else { ship.rotSpeed = 0; }

            if (isHoldingFire || keys.space) {
                holdTimer++;
                if (holdTimer > 12 && fireCooldown <= 0) { fireBullet(); fireCooldown = 10; }
            }
            if (fireCooldown > 0) fireCooldown--;
            if (screenShake > 0) screenShake--;

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                if (asteroids.length < 2 + Math.floor(wave * 1.5)) createAsteroid();
            }

            score += 0.05;
            scoreEl.innerText = padZero(score);
            let currentWave = Math.floor(score / 350) + 1;
            if (currentWave !== wave) {
                wave = currentWave; waveEl.innerText = wave;
                spawnInterval = Math.max(50, 180 - (wave * 12));
                floatingTexts.push({ text: `WAVE ${wave}`, x: canvas.width / 2, y: canvas.height / 3, life: 60 });
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                let ast = asteroids[i];
                ast.x += ast.vx; ast.y += ast.vy; ast.rotation += ast.rotSpeed;
                if (Math.hypot(ast.x - ship.x, ast.y - ship.y) < ast.radius + ship.radius - 6) {
                    triggerGameOver(); return;
                }
                let destroyed = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.hypot(ast.x - b.x, ast.y - b.y) < ast.radius) {
                        bullets.splice(j, 1); destroyed = true;
                        spawnExplosion(ast.x, ast.y, 12); score += 50;
                        if (ast.radius > 28) {
                            for (let k = 0; k < 2; k++) createAsteroid(ast.x, ast.y, 18);
                        } else if (ast.radius > 16 && Math.random() > 0.5) {
                            createAsteroid(ast.x, ast.y, 11);
                        }
                        break;
                    }
                }
                if (destroyed) asteroids.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i]; ft.y -= 0.5; ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            const dark = isDarkMode();
            const strokeColor = dark ? '#d0d0d0' : '#222222';
            const fillColor = dark ? '#1c1c1c' : '#f7f7f7';
            const bulletColor = dark ? '#ffffff' : '#222222';
            const shipStroke = dark ? '#e0e0e0' : '#222222';
            const gridColor = dark ? '#262626' : '#e0e0e0';

            ctx.fillStyle = gridColor;
            for (let x = 30; x < canvas.width; x += 60) {
                for (let y = 30; y < canvas.height; y += 60) ctx.fillRect(x, y, 2, 2);
            }

            for (let ast of asteroids) {
                ctx.save();
                ctx.translate(ast.x, ast.y); ctx.rotate(ast.rotation);
                ctx.strokeStyle = strokeColor; ctx.fillStyle = fillColor; ctx.lineWidth = 2;
                ctx.beginPath();
                ast.points.forEach((pt, k) => {
                    let nextPt = ast.points[(k + 1) % ast.points.length];
                    if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(nextPt.x, nextPt.y);
                });
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.restore();
            }

            for (let b of bullets) {
                ctx.strokeStyle = bulletColor; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.7, b.y - b.vy * 0.7); ctx.stroke();
            }

            ctx.save();
            ctx.translate(ship.x, ship.y); ctx.rotate(ship.angle);
            ctx.strokeStyle = shipStroke; ctx.fillStyle = fillColor; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(-14, 12); ctx.lineTo(-7, 0); ctx.lineTo(-14, -12);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();

            for (let p of particles) {
                ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = strokeColor;
                ctx.fillRect(p.x, p.y, 2, 2);
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function triggerGameOver() {
            SoundFX.explosion();
            let finalVal = Math.floor(score);
            finalScoreEl.innerText = finalVal;
            let topScores = getTop10Scores();
            pendingHighScoreIndex = (topScores.length < 10) ? (topScores.findIndex(s => finalVal > s.score) === -1 ? topScores.length : topScores.findIndex(s => finalVal > s.score)) : topScores.findIndex(s => finalVal > s.score);

            if (pendingHighScoreIndex !== -1 && finalVal > 0) {
                gameState = 'KEYBOARD'; currentInitials = "";
                initialsDisplay.innerText = "___";
                keyboardModal.classList.remove('hidden');
            } else {
                gameState = 'GAMEOVER';
                renderLeaderboard(-1);
                gameOverOverlay.classList.remove('hidden');
            }
        }

        restartBtn.addEventListener('click', () => {
            SoundFX.click();
            gameOverOverlay.classList.add('hidden');
            initGame(); gameState = 'PLAYING';
        });

        buildCustomKeyboard();
        renderStartGraphic();
        hiScoreEl.innerText = padZero(getTop10Scores()[0]?.score || 0);
        requestAnimationFrame(loop);
    </script>
</body>
</html>
